packages:
  - 'apps/*'
  - 'packages/*'
# Hackathon: the registry guard blocks freshly published SDK pins (aws-sdk, expo).
# Re-enable after the build. Tracked as a follow-up in docs/RUNBOOK.md.
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - prettier@3.9.7
allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

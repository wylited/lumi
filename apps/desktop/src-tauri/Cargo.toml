[package]
name = "helicopter"
version = "0.1.0"
description = "The Helicopter desktop app: the goal, the live session, and the machine's signals"
edition = "2021"
rust-version = "1.88"
resolver = "3"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[project]
name = "heli-edge-rig"
version = "0.1.0"
description = "The desk rig: camera frames up, actions and speech down."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "websockets>=13",
]

[project.optional-dependencies]
# The servo bus. lerobot is what already knows this arm's Feetech STS3215 chain,
# its homing offsets and its EEPROM travel limits, and it is the one layer that
# must not be reimplemented: it moves a physical arm at 100 Hz. It drags in
# torch (hundreds of MB) and pins numpy<2.3, so it is an extra rather than a
# default - the camera, the detector and the aiming loop need none of it, and a
# rig with no arm installs nothing here.
#   uv sync --extra arm
#
# `requires-python` is >=3.12 for this extra's sake: lerobot 0.6.1 declares 3.12
# and up, and a project that allowed 3.11 made `uv sync` itself unresolvable on a
# fresh clone - the extra failed, and so did the plain install beside it.
arm = [
    "lerobot==0.6.1",
    "feetech-servo-sdk==1.0.0",
    "pyserial>=3.5",
]

[project.scripts]
heli-rig = "heli_rig.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "heli_rig"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite imports `heli_rig` out of this directory, so it also runs for a person
# who has not installed the project yet.
pythonpath = ["."]
